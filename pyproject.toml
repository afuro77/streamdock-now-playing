[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "streamdock-now-playing"
version = "1.2.0.dev1"
description = "Windows GSMTC Now Playing / Media Controller for Stream Dock compatible hosts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{name = "Streamdock Now Playing contributors"}]
dependencies = [
  "Pillow==13.0.0", "websockets==17.2", "psutil==7.2.2",
  "comtypes==1.4.17; sys_platform == 'win32'", "typing_extensions==4.16.0",
  "pycaw==20260927; sys_platform == 'win32'",
  "winrt-runtime==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media.Control==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
]

[project.scripts]
streamdock-now-playing = "streamdock_now_playing.streamdock:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.urls]
Repository = "https://github.com/afuro77/streamdock-now-playing"
Issues = "https://github.com/afuro77/streamdock-now-playing/issues"
